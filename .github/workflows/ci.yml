name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore UrlShortener.slnx

      - name: Build
        run: dotnet build UrlShortener.slnx --no-restore --configuration Release

      # UrlShortener.Api.Tests uses Testcontainers for Postgres/Redis — GitHub-hosted
      # ubuntu runners ship Docker preinstalled and running, so no extra setup is needed.
      - name: Test
        run: dotnet test UrlShortener.slnx --no-build --configuration Release --logger "console;verbosity=normal"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t urlshortener-api .
